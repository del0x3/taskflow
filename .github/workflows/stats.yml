name: Статистика

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: taskflow-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TZL: Europe/Kiev
    steps:
      - uses: actions/checkout@v4
      - name: Сборка аналитики
        run: bash .github/scripts/stats.sh
      - name: Коммит data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data.json
          if git diff --cached --quiet; then
            echo "аналитика без изменений"
          else
            git commit -m "chore: обновление аналитики"
            for i in 1 2 3 4 5; do
              if git push; then echo "push ok"; break; fi
              git pull --rebase --autostash; sleep 2
            done
          fi

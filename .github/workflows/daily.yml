name: Ежедневно

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 UTC+3
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: taskflow-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TZL: Europe/Kiev
    steps:
      - uses: actions/checkout@v4

      - name: Ежедневный прогон
        run: bash .github/scripts/daily.sh

      - name: Коммит изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -m "chore: ежедневное обновление за $(TZ=Europe/Kiev date +%F)"
            for i in 1 2 3 4 5; do
              if git push; then echo "push ok"; break; fi
              echo "push отклонён, попытка $i — rebase"; git pull --rebase --autostash; sleep 2
            done
          fi
